<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111512" media="(prefers-color-scheme: dark)">
<meta name="description" content="יומן, שגרה ומדריך בעברית לגידול חרדונים">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פוגונה">
<title>פוגונה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Karantina:wght@700&display=swap">
<style>
/* Layout: a phone-first app shell — sticky header, one scrolling view, bottom tab bar; max 560px centered on desktop. Palette: Negev stone + ochre dragon + basalt teal. */
:root{
  --bg:#ECEEE7; --surface:#F8F9F4; --surface2:#E2E6DC; --ink:#1D221C; --muted:#5B6459; --line:#D2D7CB;
  --accent:#B9790C; --accent-ink:#7E5005; --accent-soft:#F4E4C0; --basalt:#2E5B57; --basalt-soft:#D6E4E1;
  --ok:#2C7A4B; --watch:#9C6500; --act:#BF4F1B; --vet:#B0261E;
  --ok-soft:#DDEFE3; --watch-soft:#F6EACB; --act-soft:#F8DDCF; --vet-soft:#F6D6D3;
  --dragon:#CF973A; --belly:#EDCB88; --dragon-dk:#7A5320; --beard-black:#1A1A17; --sand:#D9C49A;
  --f-display:"Karantina","Heebo",system-ui,sans-serif; --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512; --surface:#1A1F1B; --surface2:#232A24; --ink:#E8EBE2; --muted:#A2AA9E; --line:#2F3730;
  --accent:#E3A93C; --accent-ink:#F2C46A; --accent-soft:#3A2D12; --basalt:#78B0A9; --basalt-soft:#1E3330;
  --ok:#62C48E; --watch:#E6AD45; --act:#F08A55; --vet:#F3766E;
  --ok-soft:#173224; --watch-soft:#352911; --act-soft:#3A2116; --vet-soft:#3D1A18;
  --dragon:#C48B33; --belly:#DDB873; --dragon-dk:#4C3416; --beard-black:#050505; --sand:#5C4F35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1A1F1B; --surface2:#232A24; --ink:#E8EBE2; --muted:#A2AA9E; --line:#2F3730;
  --accent:#E3A93C; --accent-ink:#F2C46A; --accent-soft:#3A2D12; --basalt:#78B0A9; --basalt-soft:#1E3330;
  --ok:#62C48E; --watch:#E6AD45; --act:#F08A55; --vet:#F3766E;
  --ok-soft:#173224; --watch-soft:#352911; --act-soft:#3A2116; --vet-soft:#3D1A18;
  --dragon:#C48B33; --belly:#DDB873; --dragon-dk:#4C3416; --beard-black:#050505; --sand:#5C4F35; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;direction:rtl;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--f-display);font-size:34px;line-height:1;margin:0;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;min-height:56px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}
main{display:flex;flex-direction:column;gap:18px;padding-block:4px 16px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h .hint{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:40px;line-height:.9}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.watch{background:var(--watch-soft);color:var(--watch)}
.chip.act{background:var(--act-soft);color:var(--act)} .chip.vet{background:var(--vet-soft);color:var(--vet)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)} .chip.bas{background:var(--basalt-soft);color:var(--basalt)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1D1606;font-weight:700}
.btn.ghost{background:transparent}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
a.btn.pri{color:#1D1606}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.btn.danger{color:var(--vet)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;white-space:nowrap;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--sev,var(--muted))}
.alert.watch{--sev:var(--watch)} .alert.act{--sev:var(--act)} .alert.vet{--sev:var(--vet)} .alert.info{--sev:var(--basalt)}
.alert b{display:block;font-size:14px}
.alert span{font-size:13px;color:var(--muted)}
/* dragon cards */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.dgrid{grid-template-columns:1fr}}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.dcard .ph{aspect-ratio:16/10;max-width:100%;background:linear-gradient(180deg,var(--accent-soft),var(--surface2));position:relative;display:grid;place-items:center;overflow:hidden}
.dcard .ph img{width:100%;height:100%;object-fit:cover}
.dcard .ph svg{width:88%;height:auto}
.dcard .ph .tag{position:absolute;top:8px;inset-inline-start:8px}
.dcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.dcard .name{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.dcard .name b{font-family:var(--f-display);font-size:30px;line-height:1}
.stat{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.stat .k{color:var(--muted)}
.stat .v{font-weight:500;font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--vet)} .flat{color:var(--watch)}
/* routine */
.routine{display:flex;flex-direction:column}
.rt{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:start;width:100%;min-height:56px}
.rt:last-child{border-bottom:0}
.rt .ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.rt.done .ck{background:var(--ok);border-color:var(--ok)}
.rt.done .ck svg{stroke:var(--surface)}
.rt .t{flex:1;min-width:0}
.rt .t b{display:block;font-size:15px}
.rt .t span{font-size:13px;color:var(--muted)}
.rt .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.powder{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:var(--r);padding:14px}
.powder .big{color:var(--accent-ink)}
/* quick actions */
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;min-height:76px}
.qbtn svg{width:26px;height:26px;stroke:var(--basalt)}
/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none}
.li .ic svg{width:20px;height:20px;stroke:var(--basalt)}
.li .grow b{font-size:14px;display:block}
.li .grow span{font-size:12px;color:var(--muted);display:block}
/* behavior */
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 10px;display:flex;flex-direction:column;gap:4px;text-align:start}
.bcard .art{background:var(--surface2);border-radius:10px;aspect-ratio:2/1.15;max-width:100%;display:grid;place-items:center;overflow:hidden}
.bcard .art svg{width:100%;height:100%}
.bcard b{font-size:14px;margin-top:4px}
.bdetail{display:flex;flex-direction:column;gap:10px}
.bdetail .art{background:var(--surface2);border-radius:12px;aspect-ratio:2/1.1;max-width:100%}
.bdetail .art svg{width:100%;height:100%}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.3px}
/* forms */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:42px;font-size:14px}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.result{display:flex;flex-direction:column;gap:8px}
.res{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.res:last-child{border-bottom:0}
.res .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.note{font-size:13px;color:var(--muted)}
.src{color:var(--basalt);font-weight:500;text-decoration:none;unicode-bidi:isolate}
.src:hover{text-decoration:underline}
a.srcrow{color:inherit;text-decoration:none}
a.srcrow:hover b{text-decoration:underline}
.callout{border-radius:12px;padding:10px 12px;font-size:14px}
.callout.vet{background:var(--vet-soft);color:var(--vet)} .callout.watch{background:var(--watch-soft);color:var(--watch)} .callout.ok{background:var(--ok-soft);color:var(--ok)} .callout.info{background:var(--basalt-soft);color:var(--basalt)}
.callout b{color:inherit}
.scroll-x{overflow-x:auto}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.g tr:last-child td{border-bottom:0}
.food{display:flex;flex-wrap:wrap;gap:6px}
.food span{border-radius:999px;padding:5px 11px;font-size:13px;background:var(--surface2)}
.food.ok span{background:var(--ok-soft);color:var(--ok)}
.food.watch span{background:var(--watch-soft);color:var(--watch)}
.food.vet span{background:var(--vet-soft);color:var(--vet);text-decoration:line-through;text-decoration-thickness:1px}
.fresh{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fresh i{display:block;height:100%;background:var(--ok);border-radius:99px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:start;min-height:46px}
.chk:last-child{border-bottom:0}
.chk .bx{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:none}
.chk[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"] .bx svg{stroke:var(--surface)}
.chk[aria-pressed="true"] .lbl{color:var(--muted);text-decoration:line-through}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
.banner{font-size:13px;background:var(--watch-soft);color:var(--watch);border-radius:10px;padding:8px 12px}
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--accent-soft),var(--basalt-soft));padding:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:118px}
.hero .txt{position:relative;z-index:1}
.hero .txt .big{font-size:44px}
.hero .bgd{position:absolute;inset-inline-end:-18px;bottom:-14px;width:54%;opacity:.5}
.hero .bgd svg{width:100%;height:auto}
.chart svg{width:100%;height:auto;display:block}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 8px;color:var(--muted)}
.empty svg{width:140px}
/* dragon art animation */
.anim-bob .head{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 80%}
.anim-bob-slow .head{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 80%}
.anim-wave .arm{animation:wave 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
.anim-puff .beard{animation:puff 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 0%}
.anim-dig .sandp{animation:dig 1s ease-out infinite}
.anim-breath .bodyg{animation:breath 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.anim-zz .zz{animation:zz 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wave{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(-55deg)}}
@keyframes puff{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes dig{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-14px,-10px);opacity:0}}
@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
@keyframes zz{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div aria-hidden="true" style="width:44px" id="brandArt"></div>
      <div><h1>פוגונה</h1><small id="subtitle">יומן החרדונים שלך</small></div>
    </div>
    <div class="row" style="gap:8px"><button class="btn sm pri" id="installBtn" hidden data-act="install">התקנה</button>
    <button class="iconbtn" id="gear" hidden data-act="settings" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="ניווט" hidden><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const daysSince = s => Math.floor((parseD(today()) - parseD(s)) / 864e5);
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const heDate = s => parseD(s).toLocaleDateString("he-IL",{day:"numeric",month:"short"});
const heDateLong = d => d.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});

/* ---------------- domain logic ---------------- */
const STAGES = {
  baby:{n:"תינוק", r:"עד 3 חודשים", ins:"פעם ביום, כמה שהוא אוכל.", veg:"סלט קצוץ דק כל יום, כמה שהוא אוכל.", sup:"סידן על כל החרקים והסלט, מולטי פעמיים בשבוע."},
  juv:{n:"צעיר", r:"עד שנה, בערך", ins:"פעם ביום, 5–6 חרקים בגודל הראש.", veg:"סלט כל יום, בנפח של בערך פי 3 מהחרקים.", sup:"סידן על כל החרקים והסלט, מולטי פעמיים בשבוע."},
  adult:{n:"בוגר", r:"משנה, בערך", ins:"פעמיים בשבוע, 3–4 חרקים בגודל הראש. עודף חרקים מוביל להשמנה.", veg:"לפי ReptiFiles: 3 פעמים בשבוע, מנה בגודל הראש.", sup:"סידן על כל החרקים והסלט, מולטי פעם בשבוע."}
};
function stageOf(d){ const m = monthsOld(d.hatch); if(m===null) return null; return m<3?"baby":m<12?"juv":"adult"; }
const DEF_INSECT_DAYS = [0,3];
function insectDays(){ const v=S.config.supp.insectDays; return Array.isArray(v) && v.length ? v.map(Number) : DEF_INSECT_DAYS; }
// young dragons (or unknown age) eat insects daily; from 12 months only on the chosen days
function eatsInsects(d, dateStr){ const st=stageOf(d); if(!st || st==="baby" || st==="juv") return true; return insectDays().includes(parseD(dateStr).getDay()); }
const anyJuvenile = () => !S.dragons.length || S.dragons.some(d=>{ const st=stageOf(d); return !st || st==="baby" || st==="juv"; });
function multiDays(){ const p=S.config.supp; if(Array.isArray(p.multiDays) && p.multiDays.length) return p.multiDays.map(Number); return anyJuvenile() ? [2,5] : [5]; }
function powderFor(dateStr){
  const wd = parseD(dateStr).getDay(); const p=S.config.supp; const ca = p.d3 ? "סידן עם D3" : "סידן";
  if(wd===Number(p.plainDay)) return {k:"none", t:"בלי אבקה", s:"יום דילוג (אופציונלי, מותר לדלג לפעמים)"};
  if(multiDays().includes(wd)) return {k:"multi", t:"סידן + מולטי", s:ca+" על החרקים והסלט, ומולטי־ויטמין על הסלט"};
  return {k:"ca", t:ca, s:"אבקה דקה על החרקים ועל הסלט"};
}
function weights(id){ return dLogs(id,"weight").filter(e=>e.d===id).map(e=>({date:e.ts.slice(0,10), g:Number(e.v.g)})).filter(w=>w.g>0).sort((a,b)=>a.date.localeCompare(b.date)); }
function weightTrend(id){
  const w = weights(id); if(!w.length) return null;
  const last = w[w.length-1]; const peak = Math.max(...w.map(x=>x.g));
  const ref = [...w].reverse().find(x=> daysSince(x.date) >= 12 && x!==last) || null;
  return {last, peak, ref, delta: ref ? last.g - ref.g : null, pct: ref ? (last.g-ref.g)/ref.g*100 : null};
}
function lastOf(id,type){ return dLogs(id,type)[0] || null; }
function computeAlerts(){
  const A=[];
  S.dragons.forEach(d=>{
    const juv = (monthsOld(d.hatch) ?? 6) < 12;
    const tr = weightTrend(d.id);
    if(tr){
      if(tr.last.g < tr.peak*0.9) A.push(["vet", d.name+": ירידה של יותר מ־10% מהשיא", "שיא "+tr.peak+" ג׳, עכשיו "+tr.last.g+" ג׳. כדאי ווטרינר זוחלים."]);
      else if(tr.pct!==null && tr.pct <= -5) A.push(["act", d.name+": ירד במשקל", Math.abs(tr.pct).toFixed(1)+"% מאז "+heDate(tr.ref.date)+". לבדוק טמפרטורות ותיאבון."]);
      else if(juv && tr.ref && daysSince(tr.ref.date)>=18 && tr.delta<=0) A.push(["watch", d.name+": לא עלה במשקל", "צעיר צריך לעלות בהדרגה. ממשיכים לשקול כל שבוע."]);
      if(daysSince(tr.last.date)>=7) A.push(["info", "יום שקילה: "+d.name, "השקילה האחרונה הייתה לפני "+daysSince(tr.last.date)+" ימים."]);
    } else A.push(["info", "שקילה ראשונה: "+d.name, "משקל מטבח בגרמים, בבוקר לפני אוכל."]);
    const p = dLogs(d.id,"poop").filter(e=>e.d===d.id);
    if(p.length){
      const ds = daysSince(p[0].ts.slice(0,10));
      if(juv && ds>=5) A.push(["act", d.name+": "+ds+" ימים בלי קקי", "אמבטיה פושרת עוזרת. אם יש נפיחות או מאמץ, ווטרינר."]);
      else if(juv && ds>=3) A.push(["watch", d.name+": "+ds+" ימים בלי קקי", "אצל צעירים זה בדרך כלל כל יום־יומיים."]);
      const ur = p.slice(0,2).map(e=>e.v.urate);
      if(p[0].v.urate==="green" || p[0].v.blood) A.push(["vet", d.name+": צואה חריגה", "אוראט ירוק או דם. כדאי ווטרינר עם בדיקת צואה."]);
      else if(ur.length===2 && ur.every(u=>u==="yellow"||u==="orange")) A.push(["watch", d.name+": אוראט צהוב פעמיים ברצף", "סימן להתייבשות. ריסוס בבוקר, סלט רטוב, אמבטיה."]);
    }
    const ins = dLogs(d.id,"insect").filter(e=>e.d===d.id).slice(0,3);
    if(juv && ins.length===3 && ins.every(e=>e.v.ate==="none")) A.push(["vet", d.name+": לא אוכל חרקים 3 פעמים", "אצל צעיר זה סימן חשוב. בודקים חום, ואם זה ממשיך, לווטרינר."]);
    const sh = dLogs(d.id,"shed").filter(e=>e.d===d.id)[0];
    if(sh && sh.v.stage==="start" && daysSince(sh.ts.slice(0,10))<=14) A.push(["watch", d.name+" בהשלה", "לבדוק אצבעות וקצה זנב. אם נשאר עור, להשרות במים פושרים."]);
    if(sh && sh.v.stuck && sh.v.stuck.length) A.push(["act", d.name+": עור תקוע ב"+sh.v.stuck.join(" ו"), "אמבטיה פושרת ושחרור עדין. אם הקצה כהה או דחוס, לווטרינר."]);
    const bv = dLogs(d.id,"behavior").filter(e=>e.d===d.id && daysSince(e.ts.slice(0,10))<=3);
    bv.forEach(e=>{ const b = BEHAVIORS.find(x=>x.id===e.v.b); if(b && (b.st==="vet" || (b.juvVet && juv))) A.push(["vet", d.name+": "+b.n, b.act]); else if(b && b.juvVet) A.push(["watch", d.name+": "+b.n, b.act]); });
  });
  S.bulbs.forEach(b=>{
    if(!b.installed) return; const m = daysSince(b.installed)/30.4; const who = b.dragon && dragonById(b.dragon) ? " ("+dragonById(b.dragon).name+")" : "";
    if(m>=12) A.push(["act", "לבדוק החלפת נורה"+who, (b.label||"נורה")+" מותקנת "+Math.floor(m)+" חודשים. ה־UVB נחלש גם כשהיא עוד מאירה. לפי הוראות היצרן או מד UV."]);
    else if(m>=10) A.push(["watch", "החלפת נורה מתקרבת"+who, "בעוד כ־"+Math.max(0,Math.round(12-m))+" חודשים. כדאי להזמין מראש."]);
  });
  const sp = S.config.salad.prepared;
  if(sp){ const age = daysSince(sp); if(age>=4) A.push(["watch","קופסת הסלט ישנה","הוכנה לפני "+age+" ימים. הזמן להכין חדשה."]); else if(age===3) A.push(["info","הסלט נגמר מחר","זמן לתכנן הכנה חדשה."]); }
  powderAlerts().forEach(a=>A.push(a));
  const order = {vet:0, act:1, watch:2, info:3};
  return A.sort((a,b)=>order[a[0]]-order[b[0]]);
}

async function compressImage(f){
  try{
    const bmp = await createImageBitmap(f, {imageOrientation:"from-image"});
    const sc = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); bmp.close&&bmp.close();
    const b = await new Promise(res=>c.toBlob(res,"image/jpeg",0.82));
    return b && b.type==="image/jpeg" ? b : null; // re-encoded JPEG only: strips EXIF/GPS
  }catch(e){ return null; }
}
async function uploadTimeline(did, f){
  if(!/^image\//.test(f.type||"image/")){ toast("צריך קובץ תמונה"); return; }
  if(f.size > 40*1024*1024){ toast("התמונה גדולה מדי"); return; }
  toast("מעלה תמונה…");
  const blob = await compressImage(f);
  if(!blob){ toast("הפורמט לא נתמך בדפדפן הזה. נסו לצלם שוב או לבחור JPEG/PNG"); return; }
  if(blob.size > 10*1024*1024){ toast("התמונה גדולה מדי"); return; }
  const path = S.hh+"/tl/"+did+"-"+Date.now()+".jpg";
  const up = await sb.storage.from("photos").upload(path, blob, {contentType:"image/jpeg"});
  if(up.error){ toast("ההעלאה נכשלה"); return; }
  const {data,error} = await sb.from("dragon_photos").insert({household_id:S.hh, dragon_id:did, path, taken:today()}).select("id,dragon_id,path,taken,note").single();
  if(error){ sb.storage.from("photos").remove([path]); fail(error); return; }
  const su = await sb.storage.from("photos").createSignedUrl(path, 86400); if(su.data) photoUrls[path]=su.data.signedUrl;
  S.photos=[data].concat(S.photos||[]); render(); toast("התמונה נשמרה");
}
function logLabel(e){
  const ul = {white:"לבן", yellow:"צהוב", orange:"כתום", green:"ירוק"};
  const sl = {ca:"סידן", multi:"סידן + מולטי", none:"בלי אבקה"}; const al={all:"אכל הכול", some:"אכל חלק", none:"לא אכל"};
  switch(e.type){
    case "weight": return ["weight", e.v.g+" ג׳", "שקילה"];
    case "poop": return ["poop", "קקי · אוראט "+(ul[e.v.urate]||"—"), e.v.note||""];
    case "insect": return ["bug", "חרקים · "+(al[e.v.ate]||""), sl[e.v.supp]||""];
    case "salad": return ["leaf", "סלט הוגש", ""];
    case "mist": return ["drop", "ריסוס", ""];
    case "shed": return ["shed", e.v.stage==="start"?"השלה התחילה":"השלה הסתיימה", (e.v.stuck&&e.v.stuck.length)?"נשאר עור: "+e.v.stuck.join(", "):"אצבעות וזנב תקינים"];
    case "behavior": { const b=BEHAVIORS.find(x=>x.id===e.v.b); return ["heart", b?b.n:"התנהגות", e.v.note||""]; }
    case "note": return ["note", e.v.text||"הערה", ""];
  }
  return ["note", e.type, ""];
}

function weightChart(id){
  const w = weights(id);
  if(w.length<2) return '<div class="empty small">'+(w.length? "שקילה אחת: "+w[0].g+" ג׳. הגרף יופיע אחרי השקילה הבאה." : "אין עדיין שקילות. שוקלים פעם בשבוע, באותו יום, בבוקר.")+'</div>';
  const W=320,H=150,P={l:34,r:12,t:12,b:24};
  const xs = w.map(x=>parseD(x.date).getTime()); const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const gs = w.map(x=>x.g); let y0=Math.min(...gs), y1=Math.max(...gs); const padY=Math.max(5,(y1-y0)*0.2); y0=Math.floor((y0-padY)/10)*10; y1=Math.ceil((y1+padY)/10)*10;
  const X = t => P.l + (t-x0)/(x1-x0||1)*(W-P.l-P.r); const Y = g => H-P.b - (g-y0)/(y1-y0||1)*(H-P.t-P.b);
  let grid=""; const steps=4; for(let i=0;i<=steps;i++){ const g=y0+(y1-y0)*i/steps; const y=Y(g); grid+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(P.l-6)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="var(--muted)" font-family="Heebo">'+Math.round(g)+'</text>'; }
  const pts = w.map(x=>X(parseD(x.date).getTime())+","+Y(x.g));
  const area = 'M'+pts[0]+' L'+pts.join(" L")+' L'+X(x1)+','+(H-P.b)+' L'+X(x0)+','+(H-P.b)+' Z';
  const last = w[w.length-1];
  const lbls = '<text x="'+X(x0)+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)" text-anchor="start" font-family="Heebo">'+esc(heDate(w[0].date))+'</text><text x="'+X(x1)+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)" text-anchor="end" font-family="Heebo">'+esc(heDate(last.date))+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="גרף משקל" style="direction:ltr">'+grid+'<path d="'+area+'" fill="var(--accent-soft)"/><polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
    w.map(x=>'<circle cx="'+X(parseD(x.date).getTime())+'" cy="'+Y(x.g)+'" r="2.5" fill="var(--accent)"/>').join("")+
    '<circle cx="'+X(x1)+'" cy="'+Y(last.g)+'" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/><text x="'+(X(x1)-8)+'" y="'+(Y(last.g)-9)+'" font-size="12" font-weight="700" text-anchor="end" fill="var(--ink)" font-family="Heebo">'+last.g+'</text>'+lbls+'</svg>';
}

function calcResult(){
  const c=S.calc; const L=+c.L||0,W=+c.W||0,H=+c.H||0,dep=+c.depth||0,rock=+c.rock||0,watts=+c.watts||80,room=+c.room||18;
  const dens={sand:[1.5,1.6,"חול נקי"], mix:[1.2,1.4,"אדמה + חול"], coco:[0.15,0.35,"סיבי קוקוס"]}[c.sub];
  const liters = L*W*dep/1000; const kg0=liters*dens[0]*1.1, kg1=liters*dens[1]*1.1;
  const back = c.age==="juv"?5:7;
  const lampOffset = c.mesh ? 3 : -12;
  const dist = Math.round(H - dep - rock - back + lampOffset);
  let target, tnote;
  if(c.lamp==="mvb"){
    if(watts<=80){ target=[30,38]; tnote="נורות כספית עד 80W: בדרך כלל 30 ס״מ ומעלה. לפי האריזה."; }
    else if(watts<=125){ target=[40,46]; tnote="למשל Mega-Ray 100W: כ־45 ס״מ לגב החרדון. לפי האריזה."; }
    else { target=[46,61]; tnote="160W דורש טרריום בגובה 75 ס״מ ומעלה."; }
  } else { target = c.mesh ? [24,30] : [37,44]; tnote = "Arcadia 12% / ReptiSun 10: כ־27 ס״מ דרך רשת, כ־40 בלי. בלי מד UV עדיף להוסיף כמה ס״מ."; }
  const tube = L*0.5, tube2=L*0.75; const std=[55,85,115].filter(s=>s>=tube-5 && s<=tube2+5);
  let heat = H<=60?[50,75]:H<=90?[75,100]:[100,150]; if(room<18) heat=[heat[0]+25, heat[1]+25];
  const rockIdeal = Math.round(H - dep - back + lampOffset - (target[0]+target[1])/2);
  const warn=[];
  if(L<120 || W<60 || H<60) warn.push(["watch","קטן לבוגר. המינימום המקובל לחרדון בוגר הוא 120×60×60. לצעיר זה פתרון זמני."]);
  if(dist < target[0]) warn.push(["vet","גב החרדון יהיה קרוב מדי לנורה ("+dist+" ס״מ). להנמיך את הסלע או להגביה את הנורה. זה גובר על כל שיקול חום."]);
  else if(dist > target[1]+6) warn.push(["watch","רחוק מהנורה ("+dist+" ס״מ). ה־UVB חלש בגובה הזה. להגביה את הסלע."]);
  else warn.push(["ok","המרחק מהנורה בטווח ("+dist+" ס״מ). עכשיו מודדים טמפרטורה בפועל."]);
  if(c.lamp==="mvb" && H - dep < target[0]+back+5) warn.push(["vet","הטרריום נמוך מדי לנורה בהספק הזה. כדאי נורה חלשה יותר."]);
  if(c.sub==="coco") warn.push(["watch","קוקוס מחזיק לחות. באזורים לחים כמו מישור החוף, לשמור עליו יבש או לערבב עם חול."]);
  return {liters, kg0, kg1, dens, dist, target, tnote, std, heat, rockIdeal, warn};
}

function tempAdvice(){
  const t=S.tcheck; const b=parseFloat(t.bask), c=parseFloat(t.cool), n=parseFloat(t.night); const juv=t.age==="juv"; const mvb=t.lamp==="mvb";

  if(!isNaN(b)){
    if(b>50) A.push(["vet","באסקינג חם מסוכן ("+b+"°)", mvb? "להגביה את הנורה או להנמיך את הסלע כבר עכשיו. אסור לעמעם נורה משולבת. אם צריך, נורה חלשה יותר." : "להגביה נורה, להנמיך סלע או לעמעם את ההלוגן כבר עכשיו."]);

    else if(b>=42) A.push(["ok","באסקינג בטווח ("+b+"°)","מצוין. למדוד שוב בעונה אחרת."]);
    else if(b>=38) A.push(["watch","באסקינג קצת נמוך ("+b+"°)", mvb? "אפשר להגביה את הסלע, אבל רק אם המרחק לנורה נשאר מעל המינימום שלה. אחרת להוסיף הלוגן על טרמוסטט מעמעם." : "להגביה את הסלע או לעבור להספק גבוה יותר."]);
    else A.push(["act","באסקינג קר ("+b+"°)","חרדון לא מעכל טוב בחום כזה, וזה יכול להסביר עייפות. להוסיף או להחליף נורת חום, ולמדוד שוב אחרי שעה."]);
  }
  if(!isNaN(c)){
    if(c>29) A.push(["watch","צד קר חם מדי ("+c+"°)","החום מפוזר מדי. להזיז את הבאסקינג לקצה, לשפר אוורור, או שהטרריום קטן."]);
    else if(c<24) A.push(["watch","צד קר קר ("+c+"°)","בחורף אפשר להוסיף חום מעט. החדר כנראה קר."]);
    else A.push(["ok","צד קר בטווח ("+c+"°)",""]);
  }
  if(!isNaN(b)&&!isNaN(c) && b-c<12) A.push(["watch","מפל החום קטן ("+(b-c).toFixed(0)+"°)","צריך הבדל של 12° לפחות כדי שיוכלו לבחור. מרכזים את החום בקצה אחד."]);
  if(!isNaN(n)){
    const lo = juv?18:12;
    if(n<lo) A.push(["act","לילה קר ("+n+"°)","גוף קרמי על טרמוסטט. בלי נורה אדומה או סגולה."]);

    else A.push(["ok","לילה בטווח ("+n+"°)",""]);
  }
  return A;
}

async function saveSheet(){
  const {type, did} = sheetState; let v=null;
  if(type==="weight"){ const g=parseFloat($("#sw").value); if(!(g>0)){ toast("הזן משקל בגרם"); return; } v={g:Math.round(g*10)/10}; }

function triage(step=0){
  const Q=[
    ["האם זה קורה עכשיו ונראה חירום?","פרכוסים, לא מצליח לעמוד או להרים את הגוף, דימום, צניחה של איבר, התנשמות, פציעה."],
    ["יש סימן אזהרה?","נפיחות בלסת או בגפיים, רעידות, פצעים או ריר בפה, הפרשות מהאף, ירידה של 10% במשקל, צעיר שלא אוכל 3 ימים."],
    ["הסביבה לא בטווח?","באסקינג מתחת ל־42° או מעל 45°, נורת UV בת יותר משנה, אין אבקת סידן, לא שותה (אוראט צהוב)."]
  ];
  const R=[["vet","ווטרינר זוחלים היום","זה מצב דחוף. לפנות היום לווטרינר זוחלים או אקזוטיים."],["vet","ווטרינר זוחלים בימים הקרובים","לקבוע תור. בינתיים להמשיך לרשום משקל, אוכל וצואה, ולהביא את הסיכום מהיומן."],["watch","לתקן את הסביבה ולבדוק שוב בעוד 3–7 ימים","רוב הבעיות מתחילות בחום או ב־UV. אם אין שיפור, לחזור לשאלה השנייה."],["ok","לעקוב","לרשום כל יום ביומן. אם זה נמשך יותר משבוע או מחמיר, ווטרינר."]];
  if(step<3){ openSheet(sheetHead("בדיקה מהירה · "+(step+1)+"/3")+'<h3>'+Q[step][0]+'</h3><div class="small muted">'+Q[step][1]+'</div><div class="row"><button class="btn pri grow" data-act="triage" data-step="r'+step+'">כן</button><button class="btn grow" data-act="triage" data-step="'+(step+1)+'">לא</button></div>'); }
  else showTriage(R[3]);
}

function vetSummary(){
  const lines=["סיכום לווטרינר · "+heDateLong(new Date()),""];
  S.dragons.forEach(d=>{
    const age=monthsOld(d.hatch); lines.push(d.name+" ("+(d.sex==="F"?"נקבה":d.sex==="M"?"זכר":"")+(age!==null?", בערך "+age+" חודשים":"")+")");
    const w=weights(d.id).filter(x=>daysSince(x.date)<=60); lines.push("  משקלים: "+(w.length? w.map(x=>heDate(x.date)+" "+x.g+"ג׳").join(" · ") : "אין"));
    const L=dLogs(d.id).filter(e=>daysSince(e.ts.slice(0,10))<=30);
    const ins=L.filter(e=>e.type==="insect"&&e.d===d.id); lines.push("  ארוחות חרקים ב־30 יום: "+ins.length+" (לא אכל: "+ins.filter(e=>e.v.ate==="none").length+")");
    const pp=L.filter(e=>e.type==="poop"&&e.d===d.id); lines.push("  צואה ב־30 יום: "+pp.length+(pp[0]?" · אחרונה "+heDate(pp[0].ts)+" אוראט "+({white:"לבן",yellow:"צהוב",orange:"כתום",green:"ירוק"}[pp[0].v.urate]||""):""));
    const bh=L.filter(e=>e.type==="behavior"&&e.d===d.id).map(e=>{const b=BEHAVIORS.find(x=>x.id===e.v.b);return b?b.n:"";}); if(bh.length) lines.push("  התנהגויות: "+bh.join(", "));
    const nt=L.filter(e=>e.type==="note"&&e.d===d.id).slice(0,5); nt.forEach(e=>lines.push("  הערה "+heDate(e.ts)+": "+e.v.text));
    lines.push("");
  });
  if(S.bulbs.length) lines.push("נורות: "+S.bulbs.map(b=>(b.label||"נורה")+" "+(b.watts?b.watts+"W ":"")+"מותקנת "+(b.installed?heDate(b.installed):"")).join(" · "));
  lines.push("תוספים: סידן "+(S.config.supp.d3?"עם":"בלי")+" D3 על חרקים וסלט, מולטי־ויטמין בימים "+multiDays().map(i=>DAYS[i]).join(", "));
  const txt=lines.join("\n");
  openSheet(sheetHead("סיכום לווטרינר")+'<textarea id="vs" rows="14" style="border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);width:100%;font-size:13px" readonly>'+esc(txt)+'</textarea><button class="btn pri" data-act="copyVs">העתקה</button>');
}

const pushSupported = () => ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
let pushState = {sub:null, row:null, checked:false};
function b64ToU8(b){ const pad="=".repeat((4-b.length%4)%4); const raw=atob((b+pad).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
function sameKey(sub){ try{ const k=sub.options && sub.options.applicationServerKey; if(!k) return true; const a=new Uint8Array(k), b=b64ToU8(VAPID_PUBLIC); return a.length===b.length && a.every((x,i)=>x===b[i]); }catch(e){ return true; } }
async function saveSub(sub){ const j=sub.toJSON(); const {data,error}=await sb.from("push_subscriptions").upsert({endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, household_id:S.hh, user_id:user.id}, {onConflict:"endpoint"}).select().single(); if(error) throw error; return data; }
async function refreshPush(){
  if(!pushSupported() || !S.hh || !user){ pushState.checked=true; return; }
  try{ const reg=await navigator.serviceWorker.ready; pushState.sub=await reg.pushManager.getSubscription();
    if(pushState.sub){
      const r=await sb.from("push_subscriptions").select("*").eq("endpoint", pushState.sub.endpoint).maybeSingle(); pushState.row=r.data||null;
      // permission still granted but our row is gone (cleaned up) or household changed: re-register silently
      if(!S.adminView && Notification.permission==="granted" && (!pushState.row || pushState.row.household_id!==S.hh)) pushState.row = await saveSub(pushState.sub);
    }
  }catch(e){ console.error(e); }
  pushState.checked=true;
}
async function enablePush(){
  if(isIOS && !standalone()){ openSheet(sheetHead("התראות באייפון")+'<div class="small">באייפון התראות עובדות רק אחרי התקנה למסך הבית: שיתוף ← <b>הוסף למסך הבית</b>, ואז לפתוח את פוגונה מהאייקון ולהפעיל כאן.</div>'); return; }
  if(!pushSupported()){ toast("הדפדפן הזה לא תומך בהתראות"); return; }
  const perm = await Notification.requestPermission();
  if(perm!=="granted"){ toast(perm==="denied"?"ההתראות חסומות בהגדרות הדפדפן":"לא אושרו התראות"); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub && !sameKey(sub)){ await sub.unsubscribe(); sub=null; }
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    const data = await saveSub(sub);
    pushState.sub=sub; pushState.row=data; toast("ההתראות הופעלו"); if($("#layer").innerHTML) settingsSheet();
  }catch(e){ console.error(e); toast("לא הצלחתי להפעיל התראות"); }

/* ---------------- weather (Open-Meteo, no key) ---------------- */
let WX = {state:"idle", data:null, err:null, key:null};
const COLD_NIGHT = 12, HOT_DAY = 35;
function wxAdvice(w){
  const A=[]; if(!w) return A;
  if(w.nightMin!=null && w.nightMin<=COLD_NIGHT) A.push(["watch","לילה קר: "+w.nightMin+"° בחוץ","למדוד הלילה בתוך הטרריום. אם יורד מתחת ל־15° (18° לצעירים, רף זהיר שלנו), גוף קרמי על טרמוסטט. בלי נורה אדומה."]);
  if(w.dayMax!=null && w.dayMax>=HOT_DAY) A.push([w.dayMax>=40?"act":"watch",(w.dayMax>=40?"שרב כבד: ":"יום חם: ")+w.dayMax+"° בחוץ","לבדוק שהצד הקר נשאר עד 29°, ושהטרריום לא בשמש ישירה. אם עולה מעל 29–30°, קודם להצל ולאוורר את החדר. אם בכל זאת מכבים את הנורה, זכרו שבנורה משולבת היא גם מקור ה־UVB, אז רק לכמה שעות."]);
  return A;
}
function wxKey(){ const L=S.config.location||{}; return L.lat ? L.lat+","+L.lon+","+new Date().toISOString().slice(0,13) : null; }
async function loadWeather(k){
  const L=S.config.location||{};
  try{ const c=JSON.parse(sessionStorage.getItem("pg.wx")||"null"); if(c && c.key===k && c.state==="done"){ WX=c; render(); return; } }catch(e){}
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+L.lat+"&longitude="+L.lon+"&hourly=temperature_2m&forecast_days=2&timezone=auto");
    if(!r.ok) throw new Error("http "+r.status);
    const j=await r.json(); const t=j.hourly.time, v=j.hourly.temperature_2m;
    const pad2=n=>String(n).padStart(2,"0"), now=new Date(), ymdL=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    const today=ymdL(now), tmw=ymdL(new Date(now.getTime()+864e5)), H=now.getHours(), nowStr=today+"T"+pad2(H)+":00";
    const hr=x=>+x.slice(11,13); const idx=f=>t.map((x,i)=>i).filter(i=>f(t[i]) && typeof v[i]==="number");
    const night = H<8 ? idx(x=> x>=nowStr && x.startsWith(today) && hr(x)<=8)
                      : idx(x=> x>=nowStr && ((x.startsWith(today) && hr(x)>=20) || (x.startsWith(tmw) && hr(x)<=8)));
    const dayDate = H>=18 ? tmw : today;
    const day = idx(x=> x.startsWith(dayDate) && hr(x)>=9 && hr(x)<=18);
    const data = { nightMin: night.length? Math.round(Math.min(...night.map(i=>v[i]))) : null, dayMax: day.length? Math.round(Math.max(...day.map(i=>v[i]))) : null, dayLabel: H>=18?"מחר":"היום", nightLabel: H<8?"עד הבוקר":"הלילה", place:L.name };
    if(WX.key!==k) return; // city changed meanwhile
    WX={state:"done", key:k, data};
    try{ sessionStorage.setItem("pg.wx", JSON.stringify(WX)); }catch(e){}
  }catch(e){ if(WX.key===k) WX={state:"err", key:k, err:"לא הצלחתי לטעון מזג אוויר"}; }
  render();
}

    case "pushOn": enablePush(); break;
    case "pushOff": disablePush(); break;
    case "pushTest": testPush(); break;
    case "pushPref": setPushPref(el.dataset.k); break;
    case "saveVet": { const c=el.closest(".card"); const ph=(c.querySelector("#vPhone").value||"").trim(); if(ph && ph.replace(/\D/g,"").length<7){ toast("מספר הטלפון קצר מדי"); break; } S.config.vet={name:(c.querySelector("#vName").value||"").trim(), phone:ph, note:(c.querySelector("#vNote").value||"").trim()}; await saveConfig(); toast("נשמר"); if($("#layer").innerHTML) vetsSheet(); break; }
    case "rmMember": if(S.confirmDel==="m"+id){ S.confirmDel=null; const {error}=await sb.from("household_members").delete().eq("household_id",S.hh).eq("user_id",id); if(error) toast("ההסרה נכשלה"); else { await loadAll(true); toast("הוסר מהבית"); } settingsSheet(); } else { S.confirmDel="m"+id; settingsSheet(); } break;
    case "leaveHH": if(S.confirmDel==="leave"){ S.confirmDel=null; const {error}=await sb.from("household_members").delete().eq("household_id",S.hh).eq("user_id",user.id); if(error){ toast("לא הצלחתי לעזוב"); break; } closeSheet(); S.hh=null; lsSet("pg.hh",null); S.mode="loading"; render(); loadAll(); } else { S.confirmDel="leave"; settingsSheet(); } break;
    case "switchHH": closeSheet(); S.adminView=null; S.hh=id; lsSet("pg.hh",id); subscribeLive(); S.mode="loading"; render(); pushState.checked=false; loadAll(); break;
    case "google": { S.authBusy=true; S.authMsg=""; render(); const {error}=await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo: location.origin+location.pathname}}); if(error){ S.authBusy=false; S.authMsg="!הכניסה עם Google לא הצליחה: "+error.message; render(); } break; }
    case "logout": closeSheet(); try{ if(pushState.row) await sb.from("push_subscriptions").delete().eq("id",pushState.row.id); if(pushState.sub) await pushState.sub.unsubscribe(); }catch(e){} pushState={sub:null,row:null,checked:false}; await sb.auth.signOut(); break;
    case "vetSummary": vetSummary(); break;
    case "copyVs": { const t=$("#vs"); try{ await navigator.clipboard.writeText(t.value); toast("הועתק"); }catch(e){ t.select(); toast("סמן והעתק ידנית"); } break; }
    case "backup": doBackup(); break;
    case "restore": openSheet(sheetHead("שחזור מגיבוי")+'<div class="small">בחר את קובץ הגיבוי, או הדבק את התוכן שלו. הרשומות יתווספו לקיימות.</div><input type="file" accept="application/json,.json" id="rsFile"><textarea id="rs" rows="8" style="border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);width:100%;direction:ltr"></textarea><button class="btn pri" data-act="doRestore">שחזור</button>'); break;
    case "doRestore": doRestore(); break;
    case "addDragon": { const d={id:"new"+uid(), name:"חרדון חדש", sex:"", hatch:"", watch:false, order:S.dragons.length+1}; await saveDragon(d); settingsSheet(); break; }
    case "addBulb": { const b={id:"new"+uid(), label:"נורה משולבת", installed:today(), dragon:"", watts:80, type:"MVB"}; await saveBulb(b); settingsSheet(); break; }
    case "dSex": { const d=Object.assign({},dragonById(id)); d.sex=el.dataset.v; el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===el))); await saveDragon(d); break; }
    case "dWatch": { const d=Object.assign({},dragonById(id)); d.watch=!d.watch; await saveDragon(d); settingsSheet(); break; }
    case "dSave": { const box=el.closest("[data-drag]"); const d=Object.assign({},dragonById(id)); d.name=box.querySelector('[data-df="name"]').value.trim()||d.name; d.hatch=box.querySelector('[data-df="hatch"]').value; await saveDragon(d); toast("נשמר"); break; }
    case "bSave": { const box=el.closest("[data-bulb]"); const b=Object.assign({},S.bulbs.find(x=>x.id===id)); b.label=box.querySelector('[data-bf="label"]').value.trim(); b.installed=box.querySelector('[data-bf="installed"]').value; b.dragon=box.querySelector('[data-bf="dragon"]').value; b.watts=Number(box.querySelector('[data-bf="watts"]').value)||null; await saveBulb(b); toast("נשמר"); settingsSheet(); break; }
    case "insDayT": { const v=Number(el.dataset.v); const cur=insectDays(); const nx = cur.includes(v) ? cur.filter(x=>x!==v) : cur.concat([v]).sort(); if(!nx.length){ toast("צריך לפחות יום אחד"); break; } S.config.supp.insectDays=nx; await saveConfig(); settingsSheet(); break; }
    case "multiDayT": { const v=Number(el.dataset.v); const cur=multiDays(); S.config.supp.multiDays = cur.includes(v) ? cur.filter(x=>x!==v) : cur.concat([v]).sort(); await saveConfig(); settingsSheet(); break; }
    case "d3": S.config.supp.d3=!S.config.supp.d3; await saveConfig(); settingsSheet(); break;
  }
});
document.addEventListener("click", ev=>{ if(ev.target.classList && ev.target.classList.contains("scrim")) closeSheet(); }, true);
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && $("#layer").innerHTML) closeSheet(); });
document.addEventListener("input", ev=>{
  const k=ev.target.dataset && ev.target.dataset.calc; if(k){ S.calc[k]=ev.target.value; lsSet("pg.calc",S.calc); refreshCalc(); return; }
  if(ev.target.id==="admQ"){ const q=ev.target.value.trim().toLowerCase(); document.querySelectorAll("[data-adm]").forEach(el=>{ el.hidden = !!q && !el.dataset.adm.includes(q); }); return; }
  if(ev.target.id==="wxQ"){ clearTimeout(window._wxT); const q=ev.target.value.trim(); window._wxT=setTimeout(()=>wxSearch(q),300); return; }
  const t=ev.target.dataset && ev.target.dataset.t; if(t){ S.tcheck[t]=ev.target.value; lsSet("pg.tcheck",S.tcheck); refreshTemp(); }
});
function refreshCalc(){ // keep focus: re-render only result parts
  const focused=document.activeElement && document.activeElement.id; render(); if(focused){ const f=document.getElementById(focused); if(f){ f.focus(); const v=f.value; try{ f.setSelectionRange(v.length,v.length);}catch(e){} } }
}
const refreshTemp = refreshCalc;
document.addEventListener("change", async ev=>{
  if(ev.target.id==="rsFile" && ev.target.files[0]){ $("#rs").value = await ev.target.files[0].text(); return; }
  const tl = ev.target.dataset && ev.target.dataset.tl;
  if(tl && ev.target.files && ev.target.files[0]){ const f=ev.target.files[0]; ev.target.value=""; await uploadTimeline(tl, f); return; }
  const pid = ev.target.dataset && ev.target.dataset.photo; if(!pid) return;
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  if(f.size > 10*1024*1024){ toast("התמונה גדולה מדי (עד 10MB)"); return; }
  toast("מעלה תמונה…");
  const ext = (f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = S.hh+"/"+pid+"-"+Date.now()+"."+ext;
  const up = await sb.storage.from("photos").upload(path, f, {contentType:f.type||"image/jpeg", upsert:true});
  if(up.error){ toast("ההעלאה נכשלה"); return; }
  const su = await sb.storage.from("photos").createSignedUrl(path, 86400); if(su.data) photoUrls[path]=su.data.signedUrl;
  const d=Object.assign({},dragonById(pid)); const oldp=d.photo; d.photo=path; await saveDragon(d);
  if(oldp) sb.storage.from("photos").remove([oldp]);
  toast("התמונה נשמרה"); settingsSheet();
});
async function doLogin(){
  const email = ($("#authEmail").value||"").trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ S.authMsg="!כתובת המייל לא נראית תקינה"; render(); return; }
  S.authBusy=true; S.authMsg=""; render();
  const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin+location.pathname}});
  S.authBusy=false;
  S.authMsg = error ? (error.status===429 ? "!נשלחו יותר מדי קישורים. נסה שוב בעוד כמה דקות." : "!השליחה נכשלה: "+error.message) : "שלחנו קישור ל־"+email+". פתח אותו מהמכשיר הזה.";
  render(); const i=$("#authEmail"); if(i) i.value=email;
}
async function runScan(){
  const f = $("#scanFile") && $("#scanFile").files[0]; if(!f){ toast("בחר תמונה של האריזה"); return; }
  S.scan={state:"busy"}; render();
  const prompt = 'You are helping a bearded dragon (Pogona vitticeps) keeper in Israel identify a reptile lamp or heat product from a photo of its packaging. Read the packaging. Reply with ONLY a JSON object: {"name_he": string (product/brand name as printed), "type": one of "mercury_vapor","t5_uvb","t8_uvb","compact_uvb","coil_uvb","halogen","incandescent","ceramic","deep_heat","red_or_night","led","not_a_lamp","unknown", "type_he": Hebrew name of the type, "watts": number or null, "uvb": string as printed (e.g. "UVB 12%") or null, "verdict": "good"|"ok"|"avoid"|"unknown", "reason_he": one or two short Hebrew sentences why, "tips_he": one short Hebrew sentence on how to use it safely (e.g. mercury vapor: timer only, never a dimming thermostat; follow the box distance) or null}. Rules: compact/coil UVB and red/night/infrared/moonlight bulbs are "avoid"; ceramic is "ok" for night heat only; mercury vapor from a known brand is "good", generic/unknown brand mercury vapor is "ok" because UVB output is unverified; T5 HO 10-14% is "good"; if you cannot read the packaging, use "unknown". Do not invent numbers that are not printed.';
  try{ const res = await sample.json(prompt, {images:f}); S.scan={state:"done", res}; }
  catch(e){ const m={not_granted:"צריך לאשר לאפליקציה להשתמש ב־Claude.",image_rejected:"התמונה לא נקלטה. נסה תמונה אחרת.",rate_limited:"יותר מדי בקשות. נסה שוב בעוד רגע.",invalid_json:"לא הצלחתי לקרוא את האריזה. נסה תמונה חדה יותר.",refused:"לא הצלחתי לזהות את המוצר."}; S.scan={state:"err", err:m[e&&e.code]||"הזיהוי נכשל. נסה שוב."}; if(e&&(e.code==="not_granted"||e.code==="images_unavailable")) canImages=false; }
  render();
}
async function doBackup(){
  const data = JSON.stringify({app:"pogona", v:2, at:new Date().toISOString(), dragons:S.dragons, bulbs:S.bulbs, logs:S.logs, config:S.config}, null, 1);
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download="pogona-backup-"+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast("קובץ הגיבוי ירד"); }
  catch(e){ openSheet(sheetHead("גיבוי")+'<textarea id="vs" rows="10" readonly style="border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);width:100%;direction:ltr;font-size:12px">'+esc(data)+'</textarea><button class="btn pri" data-act="copyVs">העתקה</button>'); }
}
async function doRestore(){
  let j; try{ j=JSON.parse($("#rs").value); }catch(e){ toast("זה לא קובץ גיבוי תקין"); return; }
  if(!j || j.app!=="pogona"){ toast("זה לא גיבוי של האפליקציה"); return; }
  closeSheet(); toast("משחזר…");
  const map={};
  for(const d of (j.dragons||[])){ const same=S.dragons.find(x=>x.name===d.name); if(same){ map[d.id]=same.id; continue; } const nd=await saveDragon(Object.assign({}, d, {id:"new", photo:null})); if(nd) map[d.id]=nd.id; }
  for(const b of (j.bulbs||[])){ await saveBulb(Object.assign({}, b, {id:"new", dragon: map[b.dragon]||""})); }
  let logs = j.logs || []; if(j.months){ for(const mk in j.months) logs = logs.concat(j.months[mk].entries||[]); }
  const rows = logs.filter(e=>e.d==="both"||map[e.d]).map(e=>({household_id:S.hh, dragon_id: e.d==="both"?null:map[e.d], type:e.type, v:e.v||{}, ts:e.ts}));
  for(let i=0;i<rows.length;i+=500){ const {error}=await sb.from("logs").insert(rows.slice(i,i+500)); if(error){ fail(error); break; } }
  if(j.config && j.config.supp){ S.config.supp=Object.assign(S.config.supp, j.config.supp); if(j.config.salad) S.config.salad=j.config.salad; await saveConfig(); }
  await loadAll(); toast("השחזור הסתיים");
}

/* ---------------- install (PWA) ---------------- */
let installEvt=null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function updInstall(){ const b=$("#installBtn"); if(b) b.hidden = standalone() || !(installEvt || isIOS); }
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; updInstall(); });
window.addEventListener("appinstalled", ()=>{ installEvt=null; updInstall(); toast("פוגונה הותקנה במסך הבית"); });
async function doInstall(){
  if(installEvt){ installEvt.prompt(); const r=await installEvt.userChoice.catch(()=>null); installEvt=null; updInstall(); if(r&&r.outcome==="accepted") toast("מתקין…"); return; }
  if(isIOS){ openSheet(sheetHead("התקנה באייפון")+'<div class="small" style="display:flex;flex-direction:column;gap:8px"><div>1. בספארי, ללחוץ על כפתור השיתוף (ריבוע עם חץ למעלה) בתחתית המסך.</div><div>2. לבחור <b>הוסף למסך הבית</b>.</div><div>3. ללחוץ <b>הוסף</b>. האייקון של פוגונה יופיע במסך הבית.</div></div>'); return; }
  openSheet(sheetHead("התקנה")+'<div class="small">בתפריט הדפדפן (שלוש הנקודות) לבחור <b>התקן אפליקציה</b> או <b>הוסף למסך הבית</b>.</div>');
}
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); navigator.serviceWorker.addEventListener("message", e=>{ if(e.data && e.data.type==="pushsubscriptionchange"){ pushState.checked=false; if(user && S.hh) refreshPush(); } }); }
updInstall();

boot();
})();
</script>
</body>
